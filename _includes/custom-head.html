<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>
  (function(){
    var t=localStorage.getItem('theme');
    if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
    else if(t==='light')document.documentElement.setAttribute('data-theme','light');
  })();
</script>
<style>
  /* Inject theme toggle into Minima's stock header. */
  .site-nav {
    display: flex !important;
    align-items: center !important;
    gap: 4px;
  }
  .site-nav .trigger {
    display: flex !important;
    align-items: center !important;
    gap: 2px;
  }
</style>
<script>
  /* Add theme toggle to Minima header after DOM ready. */
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.querySelector('.site-nav .trigger');
    if (!nav) return;
    var btn = document.createElement('button');
    btn.className = 'theme-toggle';
    btn.setAttribute('aria-label', '切换主题');
    btn.innerHTML = '<svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="10" y1="16" x2="10" y2="18"/><line x1="2" y1="10" x2="4" y2="10"/><line x1="16" y1="10" x2="18" y2="10"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="14.4" y1="14.4" x2="15.8" y2="15.8"/><line x1="4.2" y1="15.8" x2="5.6" y2="14.4"/><line x1="14.4" y1="5.6" x2="15.8" y2="4.2"/></svg><svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17.5 12A7.5 7.5 0 0 1 8 2.5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>';
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var isDark = root.getAttribute('data-theme') === 'dark' ||
        (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
    nav.appendChild(btn);
  });
</script>
